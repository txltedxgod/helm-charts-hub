replicas: 3

image:
  repository: redis
  tag: "7.2-alpine"
  pullPolicy: IfNotPresent

sentinel:
  enabled: true
  port: 26379
  quorum: 2

persistence:
  enabled: true
  size: 10Gi
  storageClass: "gp3"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
